name: 编译APK（最终稳定版）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 关键修复：安装并配置 Android SDK 命令行工具
      - name: 安装 Android SDK 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O /tmp/cmdline-tools.zip
          unzip /tmp/cmdline-tools.zip -d /tmp/
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          mv /tmp/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "y" | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "ndk;25.1.8937393"
      
      - name: 编译 APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 我的免费纯净APK
          path: app/build/outputs/apk/release/*.apk
